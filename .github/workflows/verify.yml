name: Verify bindings
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-build-guards.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test native host
        run: |
          if [ "$(uname -m)" = arm64 ]; then TARGET=macosArm64; else TARGET=macosX64; fi
          ./gradlew -PnativeTargets=$TARGET :openssl:${TARGET}Test --console=plain
      - name: Test JVM (JNI library from this host's OpenSSL, docs/JVM.md)
        run: |
          if [ "$(uname -m)" = arm64 ]; then TARGET=macosArm64; else TARGET=macosX64; fi
          ./gradlew -PnativeTargets=$TARGET :openssl:jvmTest --console=plain
      - name: Validate external Maven consumer
        run: |
          ./gradlew :openssl:publishToMavenLocal -PandroidNatives=false --console=plain
          if [ "$(uname -m)" = arm64 ]; then TARGET=MacosArm64; else TARGET=MacosX64; fi
          ./gradlew -p smoke runReleaseExecutable$TARGET --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-test-reports
          path: openssl/build/test-results/
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-build-guards.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap matching Kotlin compiler and sysroot
        run: |
          ./gradlew :openssl:downloadKotlinNativeDistribution
          "$HOME/.konan/kotlin-native-prebuilt-linux-x86_64-2.4.20/bin/konanc" scripts/bootstrap.kt -target linux_x64 -produce library -o build/bootstrap
      - name: Test Linux x64
        run: ./gradlew -PnativeTargets=linuxX64 :openssl:linuxX64Test --console=plain
      - name: Test JVM (JNI library from the Linux x64 OpenSSL, docs/JVM.md)
        run: ./gradlew -PnativeTargets=linuxX64 :openssl:jvmTest --console=plain
      - name: Validate external Maven consumer
        run: |
          ./gradlew -PnativeTargets=linuxX64 :openssl:publishToMavenLocal -PandroidNatives=false --console=plain
          ./gradlew -p smoke runReleaseExecutableLinuxX64 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-reports
          path: openssl/build/test-results/
  # The JVM jar as it is released: one macOS job cross-builds the JNI library for every desktop platform from the
  # same pinned OpenSSL (Linux with the Kotlin/Native toolchain and sysroots, Windows with MinGW-w64) and assembles
  # META-INF/native/; the jvm-final jobs then run the JVM tests on each platform against exactly those binaries.
  jni:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cross toolchains (MinGW-w64; Kotlin/Native Linux sysroots)
        run: |
          brew install mingw-w64
          ./gradlew :openssl:downloadKotlinNativeDistribution --console=plain
          KONANC="$HOME/.konan/kotlin-native-prebuilt-macos-aarch64-2.4.20/bin/konanc"
          "$KONANC" scripts/bootstrap.kt -target linux_x64 -produce library -o build/bootstrap-x64
          "$KONANC" scripts/bootstrap.kt -target linux_arm64 -produce library -o build/bootstrap-arm64
      - name: Build the JVM jar with every desktop JNI library
        run: ./gradlew -PnativeTargets=none -PjniPlatforms=all :openssl:jvmJar --console=plain
      - name: Check the jar's native libraries
        run: |
          JAR=$(ls openssl/build/libs/openssl-jvm-*.jar | grep -v sources)
          unzip -l "$JAR" | grep META-INF/native/
          for lib in macos-arm64/libneton_openssl.dylib macos-x64/libneton_openssl.dylib linux-x64/libneton_openssl.so \
              linux-arm64/libneton_openssl.so windows-x64/neton_openssl.dll; do
            unzip -l "$JAR" "META-INF/native/$lib" > /dev/null || { echo "missing $lib"; exit 1; }
          done
          cp "$JAR" openssl-jvm.jar
      - uses: actions/upload-artifact@v4
        with:
          name: openssl-jvm-jar
          path: openssl-jvm.jar
  jvm-final:
    needs: jni
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
        jdk: ['8', '21']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: test-jdk
        with:
          distribution: zulu
          java-version: ${{ matrix.jdk }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: openssl-jvm-jar
      - name: JVM tests on JDK ${{ matrix.jdk }} against the jar's JNI libraries
        run: |
          mkdir jni-final && (cd jni-final && unzip -q ../openssl-jvm.jar 'META-INF/native/*')
          ./gradlew -PnativeTargets=none -PjniPrebuilt=../jni-final -PtestJavaHome="${{ steps.test-jdk.outputs.path }}" \
            :openssl:jvmTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-final-${{ matrix.os }}-jdk${{ matrix.jdk }}
          path: openssl/build/test-results/
