name: Verify bindings
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-build-guards.sh
      - run: bash scripts/test-build-lock.sh
      - run: bash scripts/test-build-cache.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test native host
        run: |
          if [ "$(uname -m)" = arm64 ]; then TARGET=macosArm64; else TARGET=macosX64; fi
          ./gradlew -PnativeTargets=$TARGET :openssl:${TARGET}Test --console=plain
      - name: Test JVM (JNI library from this host's OpenSSL, docs/JVM.md)
        run: |
          if [ "$(uname -m)" = arm64 ]; then TARGET=macosArm64; else TARGET=macosX64; fi
          ./gradlew -PnativeTargets=$TARGET :openssl:jvmTest --console=plain
      - name: Validate external Maven consumer
        run: |
          ./gradlew :openssl:publishToMavenLocal -PandroidNatives=false --console=plain
          if [ "$(uname -m)" = arm64 ]; then TARGET=MacosArm64; else TARGET=MacosX64; fi
          ./gradlew -p smoke runReleaseExecutable$TARGET --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-test-reports
          path: openssl/build/test-results/
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-build-guards.sh
      - run: bash scripts/test-build-lock.sh
      - run: bash scripts/test-build-cache.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bootstrap matching Kotlin compiler and sysroot
        run: |
          ./gradlew :openssl:downloadKotlinNativeDistribution
          "$HOME/.konan/kotlin-native-prebuilt-linux-x86_64-2.4.20/bin/konanc" scripts/bootstrap.kt -target linux_x64 -produce library -o build/bootstrap
      - name: Test Linux x64
        run: ./gradlew -PnativeTargets=linuxX64 :openssl:linuxX64Test --console=plain
      - name: Test JVM (JNI library from the Linux x64 OpenSSL, docs/JVM.md)
        run: ./gradlew -PnativeTargets=linuxX64 :openssl:jvmTest --console=plain
      - name: Validate external Maven consumer
        run: |
          ./gradlew -PnativeTargets=linuxX64 :openssl:publishToMavenLocal -PandroidNatives=false --console=plain
          ./gradlew -p smoke runReleaseExecutableLinuxX64 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-reports
          path: openssl/build/test-results/
  # A release candidate, built the way a release is: every native target, every desktop JNI library cross-built on this
  # macOS host (Linux with the Kotlin/Native toolchain and sysroots, Windows with MinGW-w64), the Android AAR with NDK 29,
  # all through the release gate (checkReleaseArtifacts), published to a plain Maven directory. The jobs after it test
  # that directory only, never the sources.
  release-candidate:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cross toolchains (MinGW-w64, NDK 29, Kotlin/Native Linux sysroots)
        run: |
          brew install mingw-w64
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          ./gradlew :openssl:downloadKotlinNativeDistribution --console=plain
          KONANC="$HOME/.konan/kotlin-native-prebuilt-macos-aarch64-2.4.20/bin/konanc"
          "$KONANC" scripts/bootstrap.kt -target linux_x64 -produce library -o build/bootstrap-x64
          "$KONANC" scripts/bootstrap.kt -target linux_arm64 -produce library -o build/bootstrap-arm64
      - name: Publish the candidate (release gate included)
        run: ./gradlew -PnativeTargets=all -PjniPlatforms=all -Pversion=4.0.2-ci :openssl:publishAllPublicationsToStagingRepository --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: openssl-release-candidate
          path: build/staging-repo/
  consumer:
    # The candidate as a downstream JVM project gets it (consumer-jvm: Kotlin 2.1, the library's common tests against
    # the published jar, its JNI library extracted from the jar) on every desktop platform, on JDK 8 and 21.
    needs: release-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
        jdk: ['8', '21']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: test-jdk
        with:
          distribution: zulu
          java-version: ${{ matrix.jdk }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: openssl-release-candidate
          path: candidate-repo
      - name: Common tests on JDK ${{ matrix.jdk }} against the candidate
        run: |
          ./gradlew -p consumer-jvm -PstagedRepository=../candidate-repo -PopensslVersion=4.0.2-ci \
            -PtestJavaHome="${{ steps.test-jdk.outputs.path }}" test --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-${{ matrix.os }}-jdk${{ matrix.jdk }}
          path: consumer-jvm/build/test-results/
